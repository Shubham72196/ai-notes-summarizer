<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Notes Summarizer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background: linear-gradient(135deg,#667eea,#764ba2);

            overflow:hidden;
        }

        .container{

            width:450px;

            padding:40px;

            border-radius:20px;

            background: rgba(255,255,255,0.15);

            backdrop-filter: blur(10px);

            box-shadow:0 8px 32px rgba(0,0,0,0.2);

            text-align:center;

            animation: fadeIn 1s ease;
        }

        h1{

            color:white;

            margin-bottom:30px;

            font-size:30px;
        }

        input[type="file"]{

            background:white;

            padding:10px;

            border-radius:10px;

            width:100%;

            margin-bottom:20px;

            cursor:pointer;
        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:#ff6b6b;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#ff4757;

            transform:scale(1.03);
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Notes Summarizer</h1>

        <form action="/process" method="POST" enctype="multipart/form-data">

            <input type="file" name="image" required>

            <button type="submit">
                Generate Summary
            </button>

        </form>

    </div>

</body>

</html>
