<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summary Result</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            padding:40px;

            background: linear-gradient(135deg,#667eea,#764ba2);

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            width:90%;
            max-width:1000px;

            background: rgba(255,255,255,0.15);

            backdrop-filter: blur(10px);

            padding:30px;

            border-radius:20px;

            box-shadow:0 8px 32px rgba(0,0,0,0.2);

            animation: fadeIn 1s ease;
        }

        h1{

            color:white;

            text-align:center;

            margin-bottom:30px;
        }

        h2{

            color:white;

            margin-top:20px;
            margin-bottom:10px;
        }

        textarea{

            width:100%;

            border:none;

            border-radius:12px;

            padding:15px;

            resize:none;

            font-size:15px;

            margin-bottom:20px;
        }

        a{

            display:inline-block;

            padding:12px 20px;

            background:#ff6b6b;

            color:white;

            text-decoration:none;

            border-radius:10px;

            transition:0.3s;
        }

        a:hover{

            background:#ff4757;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Generated Result</h1>

        <h2>Extracted Text</h2>

        <textarea rows="10">
{{ extracted_text }}
        </textarea>

        <h2>Summary</h2>

        <textarea rows="6">
{{ summary }}
        </textarea>

        <a href="/">Upload Another File</a>

    </div>

</body>

</html>
